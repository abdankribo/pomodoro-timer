<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro Timer</title><link rel="stylesheet" href="style.css"></head><body><main class="timer"><p class="eyebrow">FOCUS MODE</p><h1>Pomodoro</h1><div class="modes"><button class="mode active" data-min="25">Focus</button><button class="mode" data-min="5">Break</button></div><div class="clock" id="clock">25:00</div><div class="bar"><i id="progress"></i></div><div class="actions"><button id="start">Start</button><button id="reset">Reset</button></div><p id="status">Siap fokus?</p></main><script src="script.js"></script></body></html>
